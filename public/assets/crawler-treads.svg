  <rect x="21" y="6" width="7" height="18" rx="2" fill="#22242A"/>
  <rect x="12" y="10" width="5" height="10" rx="1" fill="#383C44"/>
  <rect x="30" y="10" width="5" height="10" rx="1" fill="#383C44"/>
</svg>
